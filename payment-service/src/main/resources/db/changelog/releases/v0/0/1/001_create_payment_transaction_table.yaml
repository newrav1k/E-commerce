databaseChangeLog:
  - changeSet:
      id: 001-create-payment-transaction-table
      author: newrav1k
      changes:
        - createTable:
            tableName: t_payments
            schemaName: payment_management
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: decimal(19, 2)
              - column:
                  name: message
                  type: text
              - column:
                  name: created_at
                  type: timestamp
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: version
                  type: integer